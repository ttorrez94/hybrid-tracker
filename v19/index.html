<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061815">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid Training">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Hybrid Training v19</title>
<meta name="hybrid-build" content="v19-tested">
<style>
:root{--bg:#061815;--surface:#0a211c;--surface2:#0d2922;--line:#1e4135;--text:#f2f3ef;--muted:#91a39b;--green:#3a7d52;--green2:#6eaa72;--danger:#a45454;--shadow:0 16px 36px rgba(0,0,0,.24)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}img{display:block}.app{min-height:100vh;background:var(--bg)}
.shell{width:min(100%,620px);margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom));background:var(--bg)}
.topbar{height:64px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}.icon-btn{width:40px;height:40px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;border-radius:12px}.icon-btn:active{background:var(--surface2)}.top-logo{width:38px;height:38px;margin:auto;object-fit:contain}.line-icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{padding:28px 0 22px;text-align:center}.brand img{width:150px;height:150px;object-fit:contain;margin:0 auto 8px}.wordmark{font-family:"Arial Narrow",Arial,sans-serif;font-weight:800;letter-spacing:.22em;font-size:28px;line-height:1}.wordmark small{display:block;font-size:12px;letter-spacing:.46em;margin-top:12px;margin-left:.46em}
.hero-row{display:grid;grid-template-columns:1fr 112px;gap:14px;align-items:center;margin-bottom:14px}.eyebrow{color:var(--green2);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero-copy h1{font-size:30px;line-height:1.05;margin:8px 0 8px;letter-spacing:-.04em}.hero-copy p{color:var(--muted);margin:0;font-size:14px}.ring{width:106px;height:106px;border-radius:50%;background:conic-gradient(var(--green2) calc(var(--score)*1%),#143027 0);display:grid;place-items:center}.ring-inner{width:82px;height:82px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}.ring strong{font-size:28px}.ring span{font-size:9px;color:var(--muted);letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.metric{padding:14px 8px;text-align:center;min-width:0}.metric .mini-icon{width:22px;height:22px;margin:0 auto 8px;color:var(--green2)}.metric strong{display:block;font-size:19px}.metric small{display:block;color:var(--muted);font-size:9px;margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}.section-head h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0}.section-head button{border:0;background:transparent;color:var(--green2);font-size:11px}.readiness{display:grid;grid-template-columns:94px 1fr;gap:16px;padding:16px;align-items:center}.readiness .ring{width:88px;height:88px}.readiness .ring-inner{width:68px;height:68px}.readiness .ring strong{font-size:24px}.readiness h3{margin:0 0 6px;font-size:18px}.readiness p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.plan-list{overflow:hidden}.plan-item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:15px;border-bottom:1px solid var(--line)}.plan-item:last-child{border-bottom:0}.plan-icon{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--green2)}.plan-item b{display:block;font-size:15px}.plan-item span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.chev{color:var(--muted);font-size:22px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,620px);padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:#071b16;border-top:1px solid var(--line)}.tab{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;gap:4px;font-size:10px}.tab svg{width:23px;height:23px}.tab.active{color:var(--green2)}
.screen-title{padding:24px 0 14px}.screen-title h1{font-size:30px;margin:0 0 6px;letter-spacing:-.04em}.screen-title p{margin:0;color:var(--muted);font-size:14px}.segmented{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 16px}.segmented button{border:0;background:transparent;color:var(--muted);padding:11px 6px}.segmented button.active{background:var(--surface2);color:var(--text)}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}.day-chip{border:0;background:transparent;color:var(--muted);padding:8px 2px;border-radius:10px;font-size:11px}.day-chip strong{display:block;color:var(--text);font-size:13px;margin-top:6px}.day-chip.active{background:var(--surface2);color:var(--green2)}
.workout-card{padding:16px;margin-bottom:12px}.workout-card h3{margin:0 0 4px;font-size:19px}.workout-card p{margin:0;color:var(--muted);font-size:13px}.primary{width:100%;border:0;border-radius:11px;padding:13px 16px;background:#255a3b;color:#fff;font-weight:700;letter-spacing:.06em;margin-top:14px}.secondary{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:10px 12px}
.exercise-list{overflow:hidden}.exercise{padding:15px;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}.exercise-top{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}.exercise-icon{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--green2)}.exercise h4{margin:0;font-size:15px}.exercise .summary{color:var(--muted);font-size:12px;margin-top:3px}.done-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted)}.done-btn.done{background:var(--green);color:white;border-color:var(--green)}.exercise-fields{display:grid;grid-template-columns:100px 1fr;gap:8px;margin-top:12px}.field label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#071b16;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.add-row{padding:14px;text-align:center}.add-row button{border:0;background:transparent;color:var(--green2);font-weight:700}
.hr-card{padding:18px}.hr-main{display:flex;align-items:center;gap:16px}.hr-heart{width:58px;height:58px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;color:var(--green2)}.hr-main strong{font-size:30px}.hr-main small{color:var(--muted)}.zone-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:18px}.zone-bar i{display:block;height:8px;border-radius:5px}.zone-bar i:nth-child(1){background:#386c74}.zone-bar i:nth-child(2){background:#578b68}.zone-bar i:nth-child(3){background:#a6a14f}.zone-bar i:nth-child(4){background:#a86d35}.zone-bar i:nth-child(5){background:#8d3d3d}.cardio-options .plan-item{grid-template-columns:44px 1fr 32px}.cardio-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.recovery-score{padding:22px;text-align:center}.recovery-score .ring{margin:0 auto 14px}.recovery-score h2{margin:0;font-size:24px}.recovery-score p{color:var(--muted);font-size:13px}.check-list{overflow:hidden}.check-row{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.check-row:last-child{border-bottom:0}.switch{width:46px;height:26px;border-radius:13px;background:#18362c;border:0;padding:3px}.switch span{display:block;width:20px;height:20px;border-radius:50%;background:#8ca097;transition:.2s}.switch.on{background:var(--green)}.switch.on span{transform:translateX(20px);background:white}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.more-card{padding:18px;min-height:116px;border:1px solid var(--line);background:var(--surface);border-radius:16px;color:var(--text);text-align:left}.more-card svg{color:var(--green2);margin-bottom:18px}.more-card b{display:block}.more-card span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.backup{margin-top:16px;padding:16px}.backup-row{display:flex;gap:10px}.backup-row button,.backup-row label{flex:1;text-align:center;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:11px;font-size:12px}.backup-row input{display:none}.history-item{padding:14px;border-bottom:1px solid var(--line)}.history-item:last-child{border-bottom:0}.history-item b{display:block}.history-item span{color:var(--muted);font-size:12px}.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#eff4ef;color:#10221a;border-radius:12px;padding:11px 16px;font-weight:700;z-index:50;box-shadow:var(--shadow)}
@media(min-width:900px){body{background:#061815}.shell{border-left:1px solid #0c2921;border-right:1px solid #0c2921}.tabs{border-left:1px solid #0c2921;border-right:1px solid #0c2921}}
</style>
</head>
<body>
<div id="app">
  <div class="app">
    <div class="shell">
      <div class="topbar">
        <button class="icon-btn" aria-label="Menu"><span style="font-size:24px;line-height:1">☰</span></button>
        <img class="top-logo" src="./teton-logo.png" alt="Hybrid Training">
        <button class="icon-btn" aria-label="Settings"><span style="font-size:22px;line-height:1">⌁</span></button>
      </div>
      <main>
        <section class="brand">
          <img src="./teton-logo.png" alt="Grand Teton logo">
          <div class="wordmark">HYBRID<small>TRAINING</small></div>
        </section>
        <div class="hero-row">
          <div class="hero-copy">
            <span class="eyebrow">Weekly progress</span>
            <h1>Good morning, Torres.</h1>
            <p>Ready for the next session.</p>
          </div>
          <div class="ring" style="--score:0"><div class="ring-inner"><strong>0/7</strong><span>DAYS</span></div></div>
        </div>
        <div class="metrics">
          <div class="metric card"><strong>52</strong><small>HRV ms</small></div>
          <div class="metric card"><strong>58</strong><small>Resting HR</small></div>
          <div class="metric card"><strong>7h 42</strong><small>Sleep</small></div>
          <div class="metric card"><strong>2,341</strong><small>Calories</small></div>
        </div>
        <section class="section">
          <div class="section-head"><h2>Readiness</h2></div>
          <div class="readiness card">
            <div class="ring" style="--score:72"><div class="ring-inner"><strong>72</strong><span>GOOD</span></div></div>
            <div><h3>Ready to train.</h3><p>Your plan is available even while saved data finishes loading.</p></div>
          </div>
        </section>
      </main>
    </div>
  </div>
</div>

<script>
const DAYS=['mon','tue','wed','thu','fri','sat','sun'];
const LABELS={mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};
const SHORT={mon:'M',tue:'T',wed:'W',thu:'T',fri:'F',sat:'S',sun:'S'};
const DEFAULT_EX={tue:['Dumbbell Bench Press','Cable Fly','Seated Cable Row','Standing Overhead Press','Lat Pulldown'],thu:['Back Squat','Conventional Deadlift','Leg Curl','Leg Extension','Calf Raise'],sat:['Face Pull','Bulgarian Split Squat','Cable Curl','Weighted Dips','Romanian Deadlift']};
function mondayISO(){const d=new Date();d.setHours(0,0,0,0);const day=d.getDay();d.setDate(d.getDate()-day+(day===0?-6:1));return d.toISOString().slice(0,10)}
function defaults(){return{weekStart:mondayISO(),dayPlan:{mon:'cardio',tue:'strength',wed:'cardio',thu:'strength',fri:'cardio',sat:'strength',sun:'recovery'},dayTitles:{mon:'Cardio',tue:'Push',wed:'Cardio',thu:'Pull / Legs',fri:'Cardio',sat:'Full Body',sun:'Recovery'},exercises:Object.fromEntries(DAYS.map(k=>[k,(DEFAULT_EX[k]||[]).map(name=>({name,weight:'',sets:['','',''],reps:'',notes:'',done:false}))])),cardio:Object.fromEntries(DAYS.map(k=>[k,{mode:k==='wed'?'Zone 2 Cardio':k==='mon'?'Recovery Walk':'Cardio',done:false,notes:'',duration:'45 min',effort:'Zone 2'}])),recovery:{done:false,notes:'',sleep:false,mobility:false,walk:false,hydration:false},addons:{},pt:{}}}
function normalize(raw){const d=defaults();if(!raw||typeof raw!=='object')return d;const s={...d,...raw};s.dayPlan={...d.dayPlan,...(raw.dayPlan||{})};s.dayTitles={...d.dayTitles,...(raw.dayTitles||{})};s.exercises={...d.exercises,...(raw.exercises||{})};DAYS.forEach(k=>{if(!Array.isArray(s.exercises[k]))s.exercises[k]=[];s.exercises[k]=s.exercises[k].map(x=>({...x,sets:Array.isArray(x.sets)?x.sets:(x.reps?String(x.reps).split('*'):['','',''])}))});s.cardio={...d.cardio,...(raw.cardio||{})};DAYS.forEach(k=>s.cardio[k]={...d.cardio[k],...(s.cardio[k]||{})});s.recovery={...d.recovery,...(raw.recovery||{})};return s}
function safeRead(key,fallback){try{const raw=localStorage.getItem(key);if(!raw)return fallback;const parsed=JSON.parse(raw);return parsed??fallback}catch(error){console.warn('Ignoring invalid saved data for',key,error);try{localStorage.removeItem(key)}catch(_){}return fallback}}
let state;let history;let active='home';let selectedDay=DAYS[(new Date().getDay()+6)%7];let sub='workouts';let toastTimer;
function save(){localStorage.setItem('wt-app-state-v19',JSON.stringify(state));localStorage.setItem('wt-history-v19',JSON.stringify(history))}
function icon(name){const paths={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',sliders:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/>',home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>',barbell:'<path d="M3 8v8M6 5v14M18 5v14M21 8v8M6 12h12"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/><path d="M6.5 12h3l1.5-3 2 6 1.5-3h3"/>',mountain:'<path d="m3 19 6-9 3 4 4-7 5 12"/><path d="M2 19h20"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',chart:'<path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/>',body:'<circle cx="12" cy="5" r="2"/><path d="M9 22v-6l-2-5 2-2h6l2 2-2 5v6M9 13h6"/>',hand:'<path d="M7 11V5a2 2 0 0 1 4 0v5M11 9V4a2 2 0 0 1 4 0v7M15 9V6a2 2 0 0 1 4 0v8c0 5-3 8-7 8-3 0-5-1-7-4l-2-4a2 2 0 0 1 3-2l2 2"/>',book:'<path d="M4 5a3 3 0 0 1 3-3h5v18H7a3 3 0 0 0-3 3V5Z"/><path d="M20 5a3 3 0 0 0-3-3h-5v18h5a3 3 0 0 1 3 3V5Z"/>',download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',upload:'<path d="M12 15V3M7 8l5-5 5 5M4 21h16"/>',check:'<path d="m5 12 4 4L19 6"/>'};return `<svg class="line-icon" viewBox="0 0 24 24">${paths[name]||paths.more}</svg>`}
function dateNum(k){const d=new Date(state.weekStart+'T00:00:00');d.setDate(d.getDate()+DAYS.indexOf(k));return d.getDate()}
function doneCount(){let n=0;DAYS.forEach(k=>{if(state.dayPlan[k]==='strength'&&(state.exercises[k]||[]).some(x=>x.done))n++;if(state.dayPlan[k]==='cardio'&&state.cardio[k]?.done)n++;if(state.dayPlan[k]==='recovery'&&state.recovery.done)n++});return n}
function notify(msg){clearTimeout(toastTimer);let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);toastTimer=setTimeout(()=>t.remove(),1800)}
function top(){return `<div class="topbar"><button class="icon-btn" onclick="notify('Menu coming soon')">${icon('menu')}</button><img class="top-logo" src="./teton-logo.png"><button class="icon-btn" onclick="setTab('more')">${icon('sliders')}</button></div>`}
function nav(){return `<nav class="tabs">${[['home','home','Home'],['strength','barbell','Strength'],['cardio','heart','Cardio'],['recovery','mountain','Recovery'],['more','more','More']].map(x=>`<button class="tab ${active===x[0]?'active':''}" onclick="setTab('${x[0]}')">${icon(x[1])}<span>${x[2]}</span></button>`).join('')}</nav>`}
function home(){const dc=doneCount(),score=Math.min(94,72+dc*3);return `${top()}<main><section class="brand"><img src="./teton-logo.png"><div class="wordmark">HYBRID<small>TRAINING</small></div></section><div class="hero-row"><div class="hero-copy"><span class="eyebrow">Weekly progress</span><h1>Good morning, Torres.</h1><p>Ready for the next session.</p></div><div class="ring" style="--score:${Math.round(dc/7*100)}"><div class="ring-inner"><strong>${dc}/7</strong><span>DAYS</span></div></div></div><div class="metrics"><div class="metric card"><div class="mini-icon">${icon('heart')}</div><strong>52</strong><small>HRV ms</small></div><div class="metric card"><div class="mini-icon">${icon('heart')}</div><strong>58</strong><small>Resting HR</small></div><div class="metric card"><div class="mini-icon">${icon('mountain')}</div><strong>7h 42</strong><small>Sleep</small></div><div class="metric card"><div class="mini-icon">${icon('chart')}</div><strong>2,341</strong><small>Calories</small></div></div><section class="section"><div class="section-head"><h2>Readiness</h2></div><div class="readiness card"><div class="ring" style="--score:${score}"><div class="ring-inner"><strong>${score}</strong><span>HIGH</span></div></div><div><h3>Your body is primed.</h3><p>Training and recovery are balanced. Keep today's work focused and controlled.</p></div></div></section><section class="section"><div class="section-head"><h2>Today's plan</h2><button onclick="setTab('strength')">View week</button></div><div class="plan-list card"><div class="plan-item" onclick="setTab('strength')"><div class="plan-icon">${icon('barbell')}</div><div><b>${state.dayTitles.tue||'Strength'}</b><span>45–60 min</span></div><div class="chev">›</div></div><div class="plan-item" onclick="setTab('cardio')"><div class="plan-icon">${icon('heart')}</div><div><b>Zone 2 Cardio</b><span>30–45 min</span></div><div class="chev">›</div></div></div></section></main>`}
function weekStrip(type){return `<div class="week-strip">${DAYS.map(k=>`<button class="day-chip ${selectedDay===k?'active':''}" onclick="selectDay('${k}','${type}')">${SHORT[k]}<strong>${dateNum(k)}</strong></button>`).join('')}</div>`}
function strength(){let k=selectedDay;if(state.dayPlan[k]!=='strength')k=['tue','thu','sat'][0];selectedDay=k;const exs=state.exercises[k]||[];return `${top()}<main><div class="screen-title"><h1>Strength</h1><p>Build, track, and progress.</p></div><div class="segmented"><button class="active">Workouts</button><button onclick="notify('Exercise catalog is in More')">Exercises</button><button onclick="showHistory()">History</button></div>${weekStrip('strength')}<div class="workout-card card"><h3>${state.dayTitles[k]||LABELS[k]}</h3><p>${LABELS[k]} · ${exs.length} exercises</p><button class="primary" onclick="notify('Workout started')">START WORKOUT</button></div><section class="section"><div class="section-head"><h2>Exercises</h2><button onclick="addExercise('${k}')">Add</button></div><div class="exercise-list card">${exs.length?exs.map((x,i)=>exerciseRow(k,x,i)).join(''):'<div class="empty">No exercises planned.</div>'}<div class="add-row"><button onclick="addExercise('${k}')">＋ ADD EXERCISE</button></div></div></section></main>`}
function exerciseRow(k,x,i){const sets=(x.sets||['','','']).slice(0,3);while(sets.length<3)sets.push('');return `<div class="exercise"><div class="exercise-top"><div class="exercise-icon">${icon('barbell')}</div><div><h4>${esc(x.name||'New exercise')}</h4><div class="summary">${x.weight?esc(x.weight)+' lb · ':''}${sets.filter(Boolean).join(' / ')||'Add working sets'}</div></div><button class="done-btn ${x.done?'done':''}" onclick="toggleExercise('${k}',${i})">${x.done?'✓':''}</button></div><div class="exercise-fields"><div class="field"><label>Weight</label><input inputmode="decimal" value="${esc(x.weight||'')}" onchange="updateExercise('${k}',${i},'weight',this.value)" placeholder="lb"></div><div class="field"><label>Reps</label><div class="sets">${sets.map((v,j)=>`<input inputmode="numeric" value="${esc(v)}" onchange="updateSet('${k}',${i},${j},this.value)" placeholder="Set ${j+1}">`).join('')}</div></div></div></div>`}
function cardio(){const k=selectedDay;const c=state.cardio[k]||{};return `${top()}<main><div class="screen-title"><h1>Cardio</h1><p>Train the engine, not just the output.</p></div><div class="segmented"><button class="active">Workouts</button><button>Activities</button><button onclick="showHistory()">History</button></div>${weekStrip('cardio')}<div class="workout-card card"><h3>${esc(c.mode||'Zone 2 Cardio')}</h3><p>${LABELS[k]} · ${esc(c.duration||'30–45 min')}</p><button class="primary" onclick="toggleCardio('${k}')">${c.done?'COMPLETED':'START WORKOUT'}</button></div><section class="section"><div class="section-head"><h2>Heart rate target</h2></div><div class="hr-card card"><div class="hr-main"><div class="hr-heart">${icon('heart')}</div><div><strong>120–140 <small>bpm</small></strong><div class="summary">60–70% max heart rate</div></div></div><div class="zone-bar"><i></i><i></i><i></i><i></i><i></i></div><div class="cardio-inputs"><div class="field"><label>Duration</label><input value="${esc(c.duration||'')}" onchange="updateCardio('${k}','duration',this.value)"></div><div class="field"><label>Effort</label><select onchange="updateCardio('${k}','effort',this.value)"><option ${c.effort==='Zone 2'?'selected':''}>Zone 2</option><option ${c.effort==='Easy'?'selected':''}>Easy</option><option ${c.effort==='Hard'?'selected':''}>Hard</option></select></div></div></div></section><section class="section"><div class="section-head"><h2>Workout options</h2></div><div class="cardio-options card">${['Zone 2 Cardio','HIIT','LISS'].map((n,i)=>`<div class="plan-item" onclick="chooseCardio('${k}','${n}')"><div class="plan-icon">${icon('heart')}</div><div><b>${n}</b><span>${['30–45 min · Endurance','20–30 min · Performance','45–60 min · Fat burn'][i]}</span></div><div class="chev">›</div></div>`).join('')}</div></section></main>`}
function recovery(){const r=state.recovery;const checks=[['sleep','Sleep target'],['mobility','Mobility'],['walk','Recovery walk'],['hydration','Hydration']];const score=72+checks.filter(x=>r[x[0]]).length*6;return `${top()}<main><div class="screen-title"><h1>Recovery</h1><p>Build capacity by recovering on purpose.</p></div><div class="recovery-score card"><div class="ring" style="--score:${score}"><div class="ring-inner"><strong>${score}</strong><span>${score>80?'HIGH':'GOOD'}</span></div></div><h2>${score>80?'Ready to perform':'Keep rebuilding'}</h2><p>Your recovery score responds to the habits below.</p></div><section class="section"><div class="section-head"><h2>Today</h2></div><div class="check-list card">${checks.map(([key,label])=>`<div class="check-row"><span>${label}</span><button class="switch ${r[key]?'on':''}" onclick="toggleRecovery('${key}')"><span></span></button></div>`).join('')}</div></section><section class="section"><div class="workout-card card"><h3>Recovery notes</h3><p>Track soreness, energy, or anything that should influence tomorrow.</p><div class="field" style="margin-top:12px"><textarea rows="4" onchange="updateRecoveryNotes(this.value)" placeholder="How do you feel?">${esc(r.notes||'')}</textarea></div><button class="primary" onclick="completeRecovery()">${r.done?'RECOVERY COMPLETE':'COMPLETE RECOVERY'}</button></div></section></main>`}
function more(){return `${top()}<main><div class="screen-title"><h1>More</h1><p>Your supporting tools and data.</p></div><div class="more-grid"><button class="more-card" onclick="showHistory()">${icon('chart')}<b>History</b><span>Completed sessions and lifts</span></button><button class="more-card" onclick="notify('Body map preserved for the next build')">${icon('body')}<b>Body Map</b><span>Training volume by muscle</span></button><button class="more-card" onclick="notify('Grip tools preserved for the next build')">${icon('hand')}<b>Grip</b><span>Climbing and hand strength</span></button><button class="more-card" onclick="notify('Catalog preserved for the next build')">${icon('book')}<b>Catalog</b><span>Exercise library</span></button></div><div class="backup card"><div class="section-head"><h2>Backup</h2></div><div class="backup-row"><button onclick="exportData()">${icon('download')} Export</button><label>${icon('upload')} Import<input type="file" accept="application/json" onchange="importData(this.files[0])"></label></div></div></main>`}
function historyView(){return `${top()}<main><div class="screen-title"><h1>History</h1><p>Your completed work.</p></div><button class="secondary" onclick="setTab('more')">← Back</button><section class="section"><div class="card">${history.length?history.slice().reverse().slice(0,50).map(h=>`<div class="history-item"><b>${esc(h.exercise||h.mode||'Workout')}</b><span>${esc(h.date||'')} · ${esc(h.weight||'')} ${h.reps?'· '+esc(h.reps):''}</span></div>`).join(''):'<div class="empty">No completed exercises in history yet.</div>'}</div></section></main>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let content=active==='home'?home():active==='strength'?strength():active==='cardio'?cardio():active==='recovery'?recovery():active==='history'?historyView():more();document.getElementById('app').innerHTML=`<div class="app"><div class="shell">${content}</div>${nav()}</div>`}
window.setTab=t=>{active=t;render();scrollTo(0,0)};window.selectDay=(k,type)=>{selectedDay=k;if(type==='strength'&&state.dayPlan[k]!=='strength'){const s=DAYS.find(d=>state.dayPlan[d]==='strength');if(s)selectedDay=s}render()};window.toggleExercise=(k,i)=>{const x=state.exercises[k][i];x.done=!x.done;if(x.done){history.push({date:new Date().toISOString().slice(0,10),day:LABELS[k],exercise:x.name,weight:x.weight,reps:(x.sets||[]).join('*'),sets:x.sets,notes:x.notes||''})}save();render()};window.updateExercise=(k,i,f,v)=>{state.exercises[k][i][f]=v;save()};window.updateSet=(k,i,j,v)=>{const x=state.exercises[k][i];x.sets=x.sets||['','',''];x.sets[j]=v;x.reps=x.sets.join('*');save()};window.addExercise=k=>{const name=prompt('Exercise name');if(name){state.exercises[k].push({name,weight:'',sets:['','',''],reps:'',notes:'',done:false});save();render()}};window.toggleCardio=k=>{state.cardio[k].done=!state.cardio[k].done;save();render()};window.updateCardio=(k,f,v)=>{state.cardio[k][f]=v;save()};window.chooseCardio=(k,n)=>{state.cardio[k].mode=n;save();render()};window.toggleRecovery=k=>{state.recovery[k]=!state.recovery[k];save();render()};window.updateRecoveryNotes=v=>{state.recovery.notes=v;save()};window.completeRecovery=()=>{state.recovery.done=!state.recovery.done;save();render()};window.showHistory=()=>{active='history';render();scrollTo(0,0)};window.exportData=()=>{const blob=new Blob([JSON.stringify({state,history,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hybrid-training-backup.json';a.click();URL.revokeObjectURL(a.href)};window.importData=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.state)state=normalize(d.state);if(Array.isArray(d.history))history=d.history;save();render();notify('Backup restored')}catch(e){alert('Could not import this backup.')}};r.readAsText(f)};window.notify=notify;
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function boot(){
  try{
    var storedState = safeRead('wt-app-state-v19', safeRead('wt-app-state', null));
    var storedHistory = safeRead('wt-history-v19', safeRead('wt-history', []));

    try{
      state = normalize(storedState);
    }catch(normalizeError){
      console.warn('Stored workout data was incompatible; starting with defaults.', normalizeError);
      try{
        if(storedState){
          localStorage.setItem('wt-app-state-recovery-copy', JSON.stringify(storedState));
        }
      }catch(copyError){}
      state = defaults();
    }

    history = Array.isArray(storedHistory) ? storedHistory : [];
    render();
    document.documentElement.setAttribute('data-hybrid-booted','true');
  }catch(error){
    console.error(error);
    var app=document.getElementById('app');
    app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:28px;background:#061815;color:#f2f3ef;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-align:center"><div style="max-width:380px"><img src="./teton-logo.png" alt="" style="width:88px;height:88px;object-fit:contain;margin:0 auto 18px"><h1 style="font-size:22px;margin:0 0 10px">Hybrid Training could not start</h1><p style="color:#91a39b;line-height:1.5;margin:0 0 18px">The exact startup error is shown below.</p><pre style="white-space:pre-wrap;text-align:left;color:#c7d3cd;background:#0a211c;border:1px solid #1e4135;border-radius:10px;padding:12px;font-size:11px">'+esc(String(error&&error.message||error))+'</pre><button onclick="localStorage.removeItem(\'wt-app-state\');localStorage.removeItem(\'wt-history\');location.reload()" style="margin-top:14px;border:0;border-radius:12px;background:#2f6947;color:white;padding:13px 18px;font-weight:700">START WITH A FRESH PLAN</button></div></div>';
  }
}
boot();

</script></body></html>
