<script>
'use strict';
const DAYS=['mon','tue','wed','thu','fri','sat','sun'];
const LABELS={mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};
const SHORT={mon:'M',tue:'T',wed:'W',thu:'T',fri:'F',sat:'S',sun:'S'};
const DEFAULT_EX={tue:['Incline Dumbbell Press','Chest Press Machine','Seated Cable Row','Standing Overhead Press','Lat Pulldown'],thu:['Back Squat','Romanian Deadlift','Leg Press','Leg Curl','Standing Calf Raise'],sat:['Pull-Up','Bulgarian Split Squat','Cable Curl','Weighted Dip','Face Pull']};
const CATALOG=[
['Incline Dumbbell Press','Chest'],['Flat Dumbbell Press','Chest'],['Chest Press Machine','Chest'],['Cable Fly','Chest'],['Weighted Dip','Chest / Triceps'],['Push-Up','Chest'],
['Pull-Up','Back'],['Lat Pulldown','Back'],['Seated Cable Row','Back'],['One-Arm Dumbbell Row','Back'],['Face Pull','Rear Delts'],['Back Extension','Posterior Chain'],
['Back Squat','Quads / Glutes'],['Romanian Deadlift','Hamstrings / Glutes'],['Conventional Deadlift','Posterior Chain'],['Leg Press','Quads / Glutes'],['Bulgarian Split Squat','Quads / Glutes'],['Walking Lunge','Quads / Glutes'],['Leg Curl','Hamstrings'],['Leg Extension','Quads'],['Standing Calf Raise','Calves'],
['Standing Overhead Press','Shoulders'],['Lateral Raise','Shoulders'],['Rear Delt Fly','Rear Delts'],['Cable Curl','Biceps'],['Hammer Curl','Biceps / Forearms'],['Triceps Pressdown','Triceps'],['Overhead Triceps Extension','Triceps'],
['Farmer Carry','Grip / Core'],['Dead Hang','Grip / Back'],['Pallof Press','Core'],['Cable Crunch','Core'],['Plank','Core']
];
function mondayISO(){const d=new Date();d.setHours(0,0,0,0);const day=d.getDay();d.setDate(d.getDate()-day+(day===0?-6:1));return d.toISOString().slice(0,10)}
function blankExercise(name){return{name,weight:'',sets:['','',''],notes:'',done:false}}
function defaults(){return{version:2,weekStart:mondayISO(),profile:{name:'Torres',goal:'Build strength and endurance'},metrics:{hrv:52,rhr:58,sleep:7.7,calories:2341,energy:7,soreness:3},dayPlan:{mon:'cardio',tue:'strength',wed:'cardio',thu:'strength',fri:'cardio',sat:'strength',sun:'recovery'},dayTitles:{mon:'Zone 2',tue:'Upper Body',wed:'Recovery Cardio',thu:'Lower Body',fri:'Zone 2',sat:'Full Body',sun:'Recovery'},exercises:Object.fromEntries(DAYS.map(k=>[k,(DEFAULT_EX[k]||[]).map(blankExercise)])),cardio:Object.fromEntries(DAYS.map(k=>[k,{mode:k==='wed'?'Recovery Walk':'Zone 2 Cardio',done:false,duration:'40',distance:'',avgHr:'',effort:'Zone 2',notes:''}])),recovery:{done:false,notes:'',sleep:false,mobility:false,walk:false,hydration:false},grip:{maxHang:'',edge:'20 mm',sessions:[],timer:{work:10,rest:50,rounds:6}},workouts:{},settings:{units:'lb'}}}
function normalize(raw){const d=defaults();if(!raw||typeof raw!=='object')return d;const s={...d,...raw};s.profile={...d.profile,...(raw.profile||{})};s.metrics={...d.metrics,...(raw.metrics||{})};s.dayPlan={...d.dayPlan,...(raw.dayPlan||{})};s.dayTitles={...d.dayTitles,...(raw.dayTitles||{})};s.exercises={...d.exercises,...(raw.exercises||{})};DAYS.forEach(k=>{if(!Array.isArray(s.exercises[k]))s.exercises[k]=[];s.exercises[k]=s.exercises[k].map(x=>({...blankExercise(x.name||'Exercise'),...x,sets:Array.isArray(x.sets)?x.sets.slice(0,3):['','','']}))});s.cardio={...d.cardio,...(raw.cardio||{})};DAYS.forEach(k=>s.cardio[k]={...d.cardio[k],...(s.cardio[k]||{})});s.recovery={...d.recovery,...(raw.recovery||{})};s.grip={...d.grip,...(raw.grip||{}),timer:{...d.grip.timer,...((raw.grip||{}).timer||{})}};s.workouts={...d.workouts,...(raw.workouts||{})};s.settings={...d.settings,...(raw.settings||{})};return s}
function safeRead(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch(e){return fallback}}
let state=normalize(safeRead('wt-app-state',null));let history=safeRead('wt-history',[]);if(!Array.isArray(history))history=[];
let active='home',selectedDay=DAYS[(new Date().getDay()+6)%7],strengthSub='workouts',cardioSub='workouts',catalogQuery='',historyFilter='all',toastTimer=null,hangInterval=null,hangRemaining=0,hangRound=1,hangPhase='work';
function save(){try{localStorage.setItem('wt-app-state',JSON.stringify(state));localStorage.setItem('wt-history',JSON.stringify(history))}catch(e){console.warn('Local storage unavailable',e)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(name){const p={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',sliders:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/>',home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>',barbell:'<path d="M3 8v8M6 5v14M18 5v14M21 8v8M6 12h12"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/><path d="M6.5 12h3l1.5-3 2 6 1.5-3h3"/>',mountain:'<path d="m3 19 6-9 3 4 4-7 5 12"/><path d="M2 19h20"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',chart:'<path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/>',body:'<circle cx="12" cy="5" r="2"/><path d="M9 22v-6l-2-5 2-2h6l2 2-2 5v6M9 13h6"/>',hand:'<path d="M7 11V5a2 2 0 0 1 4 0v5M11 9V4a2 2 0 0 1 4 0v7M15 9V6a2 2 0 0 1 4 0v8c0 5-3 8-7 8-3 0-5-1-7-4l-2-4a2 2 0 0 1 3-2l2 2"/>',book:'<path d="M4 5a3 3 0 0 1 3-3h5v18H7a3 3 0 0 0-3 3V5Z"/><path d="M20 5a3 3 0 0 0-3-3h-5v18h5a3 3 0 0 1 3 3V5Z"/>',download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',upload:'<path d="M12 15V3M7 8l5-5 5 5M4 21h16"/>',check:'<path d="m5 12 4 4L19 6"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H3v-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1Z"/>'};return `<svg class="line-icon" viewBox="0 0 24 24">${p[name]||p.more}</svg>`}
function notify(msg){clearTimeout(toastTimer);document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);toastTimer=setTimeout(()=>t.remove(),1800)}
function dateNum(k){const d=new Date(state.weekStart+'T00:00:00');d.setDate(d.getDate()+DAYS.indexOf(k));return d.getDate()}
function todayKey(){return DAYS[(new Date().getDay()+6)%7]}
function doneCount(){let n=0;DAYS.forEach(k=>{if(state.dayPlan[k]==='strength'&&(state.exercises[k]||[]).length&&(state.exercises[k]||[]).every(x=>x.done))n++;if(state.dayPlan[k]==='cardio'&&state.cardio[k].done)n++;if(state.dayPlan[k]==='recovery'&&state.recovery.done)n++});return n}
function readinessScore(){const m=state.metrics;let score=60;score+=Math.min(15,Math.max(-10,(Number(m.sleep)-6)*5));score+=Math.min(10,Math.max(-10,(Number(m.energy)-5)*2));score-=Math.max(0,(Number(m.soreness)-4)*3);score+=state.recovery.hydration?4:0;return Math.max(25,Math.min(96,Math.round(score)))}
function renderTopBar(){return `<div class="topbar"><button class="icon-btn" onclick="openQuickMenu()" aria-label="Menu">${icon('menu')}</button><img class="top-logo" src="./teton-logo.png" alt="Hybrid Training"><button class="icon-btn" onclick="openScreen('settings')" aria-label="Settings">${icon('sliders')}</button></div>`}
function nav(){return `<nav class="tabs">${[['home','home','Home'],['strength','barbell','Strength'],['cardio','heart','Cardio'],['recovery','mountain','Recovery'],['more','more','More']].map(x=>`<button class="tab ${active===x[0]?'active':''}" onclick="setTab('${x[0]}')">${icon(x[1])}<span>${x[2]}</span></button>`).join('')}</nav>`}
function weekStrip(type){return `<div class="week-strip">${DAYS.map(k=>`<button class="day-chip ${selectedDay===k?'active':''}" onclick="selectDay('${k}','${type}')">${SHORT[k]}<strong>${dateNum(k)}</strong></button>`).join('')}</div>`}
function home(){const dc=doneCount(),score=readinessScore(),today=todayKey(),kind=state.dayPlan[today],title=state.dayTitles[today];return `${renderTopBar()}<main><section class="brand"><img src="./teton-logo.png"><div class="wordmark">HYBRID<small>TRAINING</small></div></section><div class="hero-row"><div class="hero-copy"><span class="eyebrow">Weekly progress</span><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, ${esc(state.profile.name)}.</h1><p>${esc(state.profile.goal)}</p></div><div class="ring" style="--score:${Math.round(dc/7*100)}"><div class="ring-inner"><strong>${dc}/7</strong><span>DAYS</span></div></div></div><div class="metrics"><button class="metric card" onclick="editMetrics()"><div class="mini-icon">${icon('heart')}</div><strong>${esc(state.metrics.hrv)}</strong><small>HRV ms</small></button><button class="metric card" onclick="editMetrics()"><div class="mini-icon">${icon('heart')}</div><strong>${esc(state.metrics.rhr)}</strong><small>Resting HR</small></button><button class="metric card" onclick="editMetrics()"><div class="mini-icon">${icon('mountain')}</div><strong>${Number(state.metrics.sleep).toFixed(1)}h</strong><small>Sleep</small></button><button class="metric card" onclick="editMetrics()"><div class="mini-icon">${icon('chart')}</div><strong>${Number(state.metrics.calories).toLocaleString()}</strong><small>Calories</small></button></div><section class="section"><div class="section-head"><h2>Readiness</h2><button onclick="editMetrics()">Update</button></div><div class="readiness card"><div class="ring" style="--score:${score}"><div class="ring-inner"><strong>${score}</strong><span>${score>=80?'HIGH':score>=65?'GOOD':'LOW'}</span></div></div><div><h3>${score>=80?'Primed to perform.':score>=65?'Ready with intent.':'Prioritize recovery.'}</h3><p>Based on sleep, energy, soreness, and recovery habits.</p></div></div></section><section class="section"><div class="section-head"><h2>Today's plan</h2><button onclick="setTab('${kind==='strength'?'strength':kind==='cardio'?'cardio':'recovery'}')">Open</button></div><div class="plan-list card"><div class="plan-item" onclick="setTab('${kind==='strength'?'strength':kind==='cardio'?'cardio':'recovery'}')"><div class="plan-icon">${icon(kind==='strength'?'barbell':kind==='cardio'?'heart':'mountain')}</div><div><b>${esc(title)}</b><span>${kind==='strength'?'45–60 min':kind==='cardio'?'30–45 min':'Recovery focus'}</span></div><div class="chev">›</div></div><div class="plan-item" onclick="openScreen('history')"><div class="plan-icon">${icon('chart')}</div><div><b>Training history</b><span>${history.length} logged entries</span></div><div class="chev">›</div></div></div></section></main>`}
function strength(){let k=selectedDay;if(state.dayPlan[k]!=='strength'){k=DAYS.find(d=>state.dayPlan[d]==='strength')||'tue';selectedDay=k}const exs=state.exercises[k]||[],w=state.workouts[k]||{},completed=exs.filter(x=>x.done).length;return `${renderTopBar()}<main><div class="screen-title"><h1>Strength</h1><p>Build, track, and progress.</p></div><div class="segmented"><button class="${strengthSub==='workouts'?'active':''}" onclick="setStrengthSub('workouts')">Workouts</button><button class="${strengthSub==='catalog'?'active':''}" onclick="setStrengthSub('catalog')">Exercises</button><button onclick="openScreen('history')">History</button></div>${strengthSub==='catalog'?catalogContent(k):`${weekStrip('strength')}<div class="workout-card card"><h3>${esc(state.dayTitles[k])}</h3><p>${LABELS[k]} · ${exs.length} exercises</p><div class="workout-meta"><span>${completed}/${exs.length} complete</span><span class="timer">${formatTime(w.elapsed||0)}</span></div><div class="button-row"><button class="primary" onclick="toggleWorkoutTimer('${k}')">${w.running?'PAUSE':'START WORKOUT'}</button><button class="secondary" onclick="completeWorkout('${k}')">FINISH</button></div></div><section class="section"><div class="section-head"><h2>Exercises</h2><button onclick="setStrengthSub('catalog')">Add</button></div><div class="exercise-list card">${exs.length?exs.map((x,i)=>exerciseRow(k,x,i)).join(''):'<div class="empty">No exercises planned.</div>'}<div class="add-row"><button onclick="setStrengthSub('catalog')">＋ ADD EXERCISE</button></div></div></section>`}</main>`}
function exerciseRow(k,x,i){const sets=(x.sets||['','','']).slice(0,3);while(sets.length<3)sets.push('');return `<div class="exercise"><div class="exercise-top"><div class="exercise-icon">${icon('barbell')}</div><div><h4>${esc(x.name)}</h4><div class="summary">${x.weight?esc(x.weight)+' '+state.settings.units+' · ':''}${sets.filter(Boolean).join(' / ')||'Add working sets'}</div></div><button class="done-btn ${x.done?'done':''}" onclick="toggleExercise('${k}',${i})">${x.done?'✓':''}</button></div><div class="exercise-fields"><div class="field"><label>Weight</label><input inputmode="decimal" value="${esc(x.weight)}" onchange="updateExercise('${k}',${i},'weight',this.value)" placeholder="${state.settings.units}"></div><div class="field"><label>Reps</label><div class="sets">${sets.map((v,j)=>`<input inputmode="numeric" value="${esc(v)}" onchange="updateSet('${k}',${i},${j},this.value)" placeholder="Set ${j+1}">`).join('')}</div></div></div><div class="exercise-actions"><button onclick="moveExercise('${k}',${i},-1)">↑ Move</button><button onclick="moveExercise('${k}',${i},1)">↓ Move</button><button onclick="removeExercise('${k}',${i})">Remove</button></div></div>`}
function catalogContent(k){const q=catalogQuery.toLowerCase(),items=CATALOG.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q));return `<div class="catalog-search"><div class="field"><label>Search exercises</label><input value="${esc(catalogQuery)}" oninput="searchCatalog(this.value)" placeholder="Press, squat, row..."></div></div><div class="card">${items.map(x=>`<div class="catalog-item"><div><b>${x[0]}</b><span>${x[1]}</span></div><button onclick="addFromCatalog('${k}','${x[0].replace(/'/g,"\\'")}')">Add</button></div>`).join('')}</div>`}
function cardio(){const k=selectedDay,c=state.cardio[k];return `${renderTopBar()}<main><div class="screen-title"><h1>Cardio</h1><p>Train the engine, not just the output.</p></div><div class="segmented"><button class="${cardioSub==='workouts'?'active':''}" onclick="setCardioSub('workouts')">Workouts</button><button class="${cardioSub==='log'?'active':''}" onclick="setCardioSub('log')">Log</button><button onclick="openScreen('history')">History</button></div>${weekStrip('cardio')}<div class="workout-card card"><h3>${esc(c.mode)}</h3><p>${LABELS[k]} · ${esc(c.duration||'40')} min</p><button class="primary" onclick="toggleCardio('${k}')">${c.done?'COMPLETED':'COMPLETE WORKOUT'}</button></div>${cardioSub==='log'?cardioLog(k,c):cardioWorkouts(k,c)}</main>`}
function cardioWorkouts(k,c){return `<section class="section"><div class="section-head"><h2>Heart rate target</h2></div><div class="hr-card card"><div class="hr-main"><div class="hr-heart">${icon('heart')}</div><div><strong>${c.mode==='HIIT'?'145–170':'120–140'} <small>bpm</small></strong><div class="summary">${c.mode==='HIIT'?'Performance intervals':'Aerobic base'}</div></div></div><div class="zone-bar"><i></i><i></i><i></i><i></i><i></i></div></div></section><section class="section"><div class="section-head"><h2>Workout options</h2></div><div class="cardio-options card">${[['Zone 2 Cardio','30–45 min · Endurance'],['HIIT','20–30 min · Performance'],['LISS','45–60 min · Easy volume'],['Recovery Walk','20–40 min · Recovery']].map(n=>`<div class="plan-item" onclick="chooseCardio('${k}','${n[0]}')"><div class="plan-icon">${icon('heart')}</div><div><b>${n[0]}</b><span>${n[1]}</span></div><div class="chev">›</div></div>`).join('')}</div></section>`}
function cardioLog(k,c){return `<section class="section"><div class="workout-card card"><h3>Session details</h3><div class="form-grid"><div class="field"><label>Duration (min)</label><input inputmode="numeric" value="${esc(c.duration)}" onchange="updateCardio('${k}','duration',this.value)"></div><div class="field"><label>Distance</label><input inputmode="decimal" value="${esc(c.distance)}" onchange="updateCardio('${k}','distance',this.value)" placeholder="miles"></div><div class="field"><label>Average HR</label><input inputmode="numeric" value="${esc(c.avgHr)}" onchange="updateCardio('${k}','avgHr',this.value)" placeholder="bpm"></div><div class="field"><label>Effort</label><select onchange="updateCardio('${k}','effort',this.value)">${['Easy','Zone 2','Moderate','Hard'].map(v=>`<option ${c.effort===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field wide"><label>Notes</label><textarea rows="4" onchange="updateCardio('${k}','notes',this.value)">${esc(c.notes)}</textarea></div></div></div></section>`}
function recovery(){const r=state.recovery,score=readinessScore(),checks=[['sleep','Sleep target'],['mobility','Mobility'],['walk','Recovery walk'],['hydration','Hydration']];return `${renderTopBar()}<main><div class="screen-title"><h1>Recovery</h1><p>Build capacity by recovering on purpose.</p></div><div class="recovery-score card"><div class="ring" style="--score:${score}"><div class="ring-inner"><strong>${score}</strong><span>${score>=80?'HIGH':score>=65?'GOOD':'LOW'}</span></div></div><h2>${score>=80?'Ready to perform':score>=65?'Keep rebuilding':'Pull back today'}</h2><p>Update your metrics and habits to keep this useful.</p><button class="secondary" onclick="editMetrics()">UPDATE METRICS</button></div><section class="section"><div class="section-head"><h2>Today</h2></div><div class="check-list card">${checks.map(([key,label])=>`<div class="check-row"><span>${label}</span><button class="switch ${r[key]?'on':''}" onclick="toggleRecovery('${key}')"><span></span></button></div>`).join('')}</div></section><section class="section"><div class="workout-card card"><h3>Recovery notes</h3><div class="field" style="margin-top:12px"><textarea rows="4" onchange="updateRecoveryNotes(this.value)" placeholder="Soreness, energy, pain, stress...">${esc(r.notes)}</textarea></div><button class="primary" onclick="completeRecovery()">${r.done?'RECOVERY COMPLETE':'COMPLETE RECOVERY'}</button></div></section></main>`}
function more(){return `${renderTopBar()}<main><div class="screen-title"><h1>More</h1><p>Your supporting tools and data.</p></div><div class="more-grid"><button class="more-card" onclick="openScreen('history')">${icon('chart')}<b>History</b><span>Completed sessions and lifts</span></button><button class="more-card" onclick="openScreen('body')">${icon('body')}<b>Body Map</b><span>Weekly volume by muscle</span></button><button class="more-card" onclick="openScreen('grip')">${icon('hand')}<b>Grip</b><span>Hangboard and hand strength</span></button><button class="more-card" onclick="openScreen('catalog')">${icon('book')}<b>Catalog</b><span>Exercise library</span></button><button class="more-card" onclick="openScreen('settings')">${icon('settings')}<b>Settings</b><span>Profile, units, and data</span></button></div><div class="backup card"><div class="section-head"><h2>Backup</h2></div><div class="backup-row"><button onclick="exportData()">${icon('download')} Export</button><label>${icon('upload')} Import<input type="file" accept="application/json" onchange="importData(this.files[0])"></label></div></div></main>`}
function historyView(){const rows=history.map((h,i)=>({h,i})).filter(x=>historyFilter==='all'||x.h.type===historyFilter);return `${renderTopBar()}<main><div class="back-row"><button onclick="setTab('more')">← Back</button></div><div class="screen-title"><h1>History</h1><p>Your completed work.</p></div><div class="segmented"><button class="${historyFilter==='all'?'active':''}" onclick="setHistoryFilter('all')">All</button><button class="${historyFilter==='strength'?'active':''}" onclick="setHistoryFilter('strength')">Strength</button><button class="${historyFilter==='cardio'?'active':''}" onclick="setHistoryFilter('cardio')">Cardio</button></div><div class="card">${rows.length?rows.slice().reverse().map(({h,i})=>`<div class="history-item"><div><b>${esc(h.title||h.exercise||h.mode||'Workout')}</b><span>${esc(h.date)} · ${esc(h.detail||'')}</span></div><button onclick="deleteHistory(${i})">${icon('trash')}</button></div>`).join(''):'<div class="empty">No matching history yet.</div>'}</div></main>`}
function muscleVolumes(){const map={Chest:0,Back:0,Shoulders:0,Quads:0,Hamstrings:0,Glutes:0,Arms:0,Core:0,Grip:0};DAYS.forEach(k=>(state.exercises[k]||[]).forEach(x=>{if(!x.done)return;const n=x.name.toLowerCase(),sets=(x.sets||[]).filter(Boolean).length||3;if(/press|fly|dip|push-up/.test(n))map.Chest+=sets;if(/row|pull|deadlift|face pull/.test(n))map.Back+=sets;if(/overhead|lateral|rear delt|face pull/.test(n))map.Shoulders+=sets;if(/squat|leg press|lunge|extension|split squat/.test(n))map.Quads+=sets;if(/romanian|deadlift|leg curl/.test(n))map.Hamstrings+=sets;if(/squat|deadlift|lunge|split squat|hip/.test(n))map.Glutes+=sets;if(/curl|triceps|dip/.test(n))map.Arms+=sets;if(/plank|crunch|pallof|carry/.test(n))map.Core+=sets;if(/hang|carry|hammer/.test(n))map.Grip+=sets}));return map}
function bodyView(){const m=muscleVolumes(),max=Math.max(1,...Object.values(m));return `${renderTopBar()}<main><div class="back-row"><button onclick="setTab('more')">← Back</button></div><div class="screen-title"><h1>Body Map</h1><p>Completed working sets this week.</p></div><div class="stat-grid"><div class="stat card"><strong>${Object.values(m).reduce((a,b)=>a+b,0)}</strong><span>Total sets</span></div><div class="stat card"><strong>${Object.values(m).filter(v=>v>0).length}</strong><span>Areas trained</span></div><div class="stat card"><strong>${doneCount()}</strong><span>Days complete</span></div></div><section class="section"><div class="progress-list card">${Object.entries(m).map(([name,v])=>`<div class="progress-row"><div class="progress-head"><b>${name}</b><span>${v} sets</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(v/max*100)}%"></div></div></div>`).join('')}</div></section></main>`}
function gripView(){const g=state.grip,last=(g.sessions||[]).slice(-1)[0];return `${renderTopBar()}<main><div class="back-row"><button onclick="setTab('more')">← Back</button></div><div class="screen-title"><h1>Grip</h1><p>Climbing-specific strength and capacity.</p></div><div class="stat-grid"><div class="stat card"><strong>${esc(g.maxHang||'—')}</strong><span>Max hang lb</span></div><div class="stat card"><strong>${esc(g.edge)}</strong><span>Edge</span></div><div class="stat card"><strong>${g.sessions.length}</strong><span>Sessions</span></div></div><section class="section"><div class="hang-card card"><div class="hang-phase">${hangInterval?hangPhase:'Repeaters'}</div><div class="hang-clock">${hangInterval?hangRemaining:g.timer.work}</div><p>${hangInterval?'Round '+hangRound+' of '+g.timer.rounds:`${g.timer.work}s work / ${g.timer.rest}s rest × ${g.timer.rounds}`}</p><button class="primary" onclick="toggleHangTimer()">${hangInterval?'STOP TIMER':'START TIMER'}</button></div></section><section class="section"><div class="workout-card card"><h3>Log max hang</h3><div class="form-grid"><div class="field"><label>Added weight</label><input id="hangWeight" inputmode="decimal" value="${esc(g.maxHang)}" placeholder="lb"></div><div class="field"><label>Edge</label><select id="hangEdge">${['10 mm','15 mm','20 mm','25 mm','Jug'].map(v=>`<option ${g.edge===v?'selected':''}>${v}</option>`).join('')}</select></div></div><button class="primary" onclick="saveGripSession()">SAVE GRIP SESSION</button>${last?`<p style="margin-top:12px">Last: ${esc(last.date)} · ${esc(last.weight)} lb on ${esc(last.edge)}</p>`:''}</div></section></main>`}
function catalogView(){return `${renderTopBar()}<main><div class="back-row"><button onclick="setTab('more')">← Back</button></div><div class="screen-title"><h1>Catalog</h1><p>Add exercises to any strength day.</p></div><div class="field" style="margin-bottom:12px"><label>Add to day</label><select onchange="selectedDay=this.value;render()">${DAYS.filter(k=>state.dayPlan[k]==='strength').map(k=>`<option value="${k}" ${selectedDay===k?'selected':''}>${LABELS[k]} — ${esc(state.dayTitles[k])}</option>`).join('')}</select></div>${catalogContent(selectedDay)}</main>`}
function settingsView(){return `${renderTopBar()}<main><div class="back-row"><button onclick="setTab('more')">← Back</button></div><div class="screen-title"><h1>Settings</h1><p>Make the app yours.</p></div><div class="settings-card card"><h3>Profile</h3><div class="form-grid"><div class="field"><label>Name</label><input value="${esc(state.profile.name)}" onchange="updateSetting('profile','name',this.value)"></div><div class="field"><label>Units</label><select onchange="updateSetting('settings','units',this.value)"><option ${state.settings.units==='lb'?'selected':''}>lb</option><option ${state.settings.units==='kg'?'selected':''}>kg</option></select></div><div class="field wide"><label>Current goal</label><input value="${esc(state.profile.goal)}" onchange="updateSetting('profile','goal',this.value)"></div></div></div><div class="settings-card card"><h3>Weekly plan titles</h3>${DAYS.map(k=>`<div class="field" style="margin-top:10px"><label>${LABELS[k]}</label><input value="${esc(state.dayTitles[k])}" onchange="updateDayTitle('${k}',this.value)"></div>`).join('')}</div><div class="settings-card card danger-zone"><h3>Data controls</h3><div class="button-row"><button class="secondary" onclick="startNewWeek()">NEW WEEK</button><button class="primary danger" onclick="resetEverything()">RESET APP</button></div></div><div class="version">Hybrid Training 2.0 · Finished build</div></main>`}
function render(){const views={home, strength, cardio, recovery, more, history:historyView, body:bodyView, grip:gripView, catalog:catalogView, settings:settingsView};const content=(views[active]||home)();document.getElementById('app').innerHTML=`<div class="app"><div class="shell">${content}</div>${nav()}</div>`}
function setTab(t){active=t;if(t==='strength'&&state.dayPlan[selectedDay]!=='strength')selectedDay='tue';render();scrollTo(0,0)}
function openScreen(t){active=t;render();scrollTo(0,0)}
function selectDay(k,type){selectedDay=k;if(type==='strength'&&state.dayPlan[k]!=='strength'){notify('Choose a strength day');return}render()}
function setStrengthSub(v){strengthSub=v;render()}function setCardioSub(v){cardioSub=v;render()}function searchCatalog(v){catalogQuery=v;render()}function setHistoryFilter(v){historyFilter=v;render()}
function toggleExercise(k,i){const x=state.exercises[k][i];x.done=!x.done;if(x.done)history.push({type:'strength',date:new Date().toLocaleDateString(),title:x.name,detail:`${x.weight||'—'} ${state.settings.units} · ${(x.sets||[]).filter(Boolean).join('/')||'sets logged'}`});save();render()}
function updateExercise(k,i,f,v){state.exercises[k][i][f]=v;save()}function updateSet(k,i,j,v){state.exercises[k][i].sets[j]=v;save()}
function addFromCatalog(k,name){if(!state.exercises[k])state.exercises[k]=[];state.exercises[k].push(blankExercise(name));save();notify(name+' added');strengthSub='workouts';active='strength';render()}
function removeExercise(k,i){if(confirm('Remove this exercise?')){state.exercises[k].splice(i,1);save();render()}}
function moveExercise(k,i,d){const a=state.exercises[k],n=i+d;if(n<0||n>=a.length)return;[a[i],a[n]]=[a[n],a[i]];save();render()}
let workoutTicker=null;function toggleWorkoutTimer(k){const w=state.workouts[k]||(state.workouts[k]={elapsed:0,running:false});w.running=!w.running;if(w.running){w.started=Date.now()-w.elapsed*1000;clearInterval(workoutTicker);workoutTicker=setInterval(()=>{w.elapsed=Math.floor((Date.now()-w.started)/1000);save();if(active==='strength')render()},1000)}else{clearInterval(workoutTicker)}save();render()}
function completeWorkout(k){const exs=state.exercises[k]||[];if(!exs.some(x=>x.done)&&!confirm('Finish with no exercises marked complete?'))return;const w=state.workouts[k]||(state.workouts[k]={elapsed:0});w.running=false;clearInterval(workoutTicker);history.push({type:'strength',date:new Date().toLocaleDateString(),title:state.dayTitles[k],detail:`${exs.filter(x=>x.done).length}/${exs.length} exercises · ${formatTime(w.elapsed||0)}`});save();notify('Workout saved');render()}
function formatTime(s){s=Number(s)||0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function chooseCardio(k,n){state.cardio[k].mode=n;cardioSub='log';save();render()}function updateCardio(k,f,v){state.cardio[k][f]=v;save()}
function toggleCardio(k){const c=state.cardio[k];c.done=!c.done;if(c.done)history.push({type:'cardio',date:new Date().toLocaleDateString(),title:c.mode,detail:`${c.duration||'—'} min${c.distance?' · '+c.distance+' mi':''}${c.avgHr?' · '+c.avgHr+' bpm':''}`});save();render()}
function toggleRecovery(k){state.recovery[k]=!state.recovery[k];save();render()}function updateRecoveryNotes(v){state.recovery.notes=v;save()}function completeRecovery(){state.recovery.done=!state.recovery.done;if(state.recovery.done)history.push({type:'recovery',date:new Date().toLocaleDateString(),title:'Recovery day',detail:'Recovery habits completed'});save();render()}
function editMetrics(){const m=state.metrics;document.getElementById('overlay').innerHTML=`<div class="modal-wrap" onclick="closeModal(event)"><div class="modal"><div class="modal-head"><h2>Daily metrics</h2><button onclick="closeOverlay()">×</button></div><div class="form-grid" style="margin-top:18px"><div class="field"><label>HRV</label><input id="mHrv" inputmode="numeric" value="${m.hrv}"></div><div class="field"><label>Resting HR</label><input id="mRhr" inputmode="numeric" value="${m.rhr}"></div><div class="field"><label>Sleep hours</label><input id="mSleep" inputmode="decimal" value="${m.sleep}"></div><div class="field"><label>Calories</label><input id="mCal" inputmode="numeric" value="${m.calories}"></div><div class="field"><label>Energy 1–10</label><input id="mEnergy" inputmode="numeric" value="${m.energy}"></div><div class="field"><label>Soreness 1–10</label><input id="mSore" inputmode="numeric" value="${m.soreness}"></div></div><button class="primary" onclick="saveMetrics()">SAVE METRICS</button></div></div>`}
function saveMetrics(){const val=id=>document.getElementById(id).value;state.metrics={hrv:Number(val('mHrv'))||0,rhr:Number(val('mRhr'))||0,sleep:Number(val('mSleep'))||0,calories:Number(val('mCal'))||0,energy:Number(val('mEnergy'))||0,soreness:Number(val('mSore'))||0};save();closeOverlay();render()}
function closeModal(e){if(e.target.classList.contains('modal-wrap'))closeOverlay()}function closeOverlay(){document.getElementById('overlay').innerHTML=''}
function openQuickMenu(){document.getElementById('overlay').innerHTML=`<div class="modal-wrap" onclick="closeModal(event)"><div class="modal"><div class="modal-head"><h2>Quick actions</h2><button onclick="closeOverlay()">×</button></div><div class="plan-list card" style="margin-top:16px"><div class="plan-item" onclick="closeOverlay();setTab('strength')"><div class="plan-icon">${icon('barbell')}</div><div><b>Start strength</b><span>Open this week's lifts</span></div><div class="chev">›</div></div><div class="plan-item" onclick="closeOverlay();setTab('cardio')"><div class="plan-icon">${icon('heart')}</div><div><b>Log cardio</b><span>Track duration and heart rate</span></div><div class="chev">›</div></div><div class="plan-item" onclick="closeOverlay();editMetrics()"><div class="plan-icon">${icon('chart')}</div><div><b>Update readiness</b><span>Sleep, HRV, energy, soreness</span></div><div class="chev">›</div></div></div></div></div>`}
function saveGripSession(){const w=document.getElementById('hangWeight').value,e=document.getElementById('hangEdge').value;state.grip.maxHang=w;state.grip.edge=e;state.grip.sessions.push({date:new Date().toLocaleDateString(),weight:w,edge:e});history.push({type:'grip',date:new Date().toLocaleDateString(),title:'Max hang',detail:`${w||'Bodyweight'} ${state.settings.units} · ${e}`});save();notify('Grip session saved');render()}
function toggleHangTimer(){if(hangInterval){clearInterval(hangInterval);hangInterval=null;render();return}hangRound=1;hangPhase='work';hangRemaining=state.grip.timer.work;hangInterval=setInterval(()=>{hangRemaining--;if(hangRemaining<=0){if(hangPhase==='work'){hangPhase='rest';hangRemaining=state.grip.timer.rest}else{hangRound++;if(hangRound>state.grip.timer.rounds){clearInterval(hangInterval);hangInterval=null;notify('Repeaters complete');history.push({type:'grip',date:new Date().toLocaleDateString(),title:'Repeaters',detail:`${state.grip.timer.rounds} rounds · ${state.grip.edge}`});save();render();return}hangPhase='work';hangRemaining=state.grip.timer.work}}if(active==='grip')render()},1000);render()}
function deleteHistory(i){history.splice(i,1);save();render()}
function updateSetting(section,key,v){state[section][key]=v;save();render()}function updateDayTitle(k,v){state.dayTitles[k]=v;save()}
function startNewWeek(){if(!confirm('Clear completion marks for a new week?'))return;DAYS.forEach(k=>{state.exercises[k].forEach(x=>x.done=false);state.cardio[k].done=false});state.recovery.done=false;state.weekStart=mondayISO();state.workouts={};save();render();notify('New week started')}
function resetEverything(){if(!confirm('Delete all app data? This cannot be undone.'))return;localStorage.removeItem('wt-app-state');localStorage.removeItem('wt-history');state=defaults();history=[];save();active='home';render()}
function exportData(){const blob=new Blob([JSON.stringify({state,history,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hybrid-training-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);state=normalize(d.state);history=Array.isArray(d.history)?d.history:[];save();render();notify('Backup restored')}catch(e){alert('Could not import this backup.')}};r.readAsText(f)}
window.setTab=setTab;window.openScreen=openScreen;window.selectDay=selectDay;window.setStrengthSub=setStrengthSub;window.setCardioSub=setCardioSub;window.searchCatalog=searchCatalog;window.setHistoryFilter=setHistoryFilter;window.toggleExercise=toggleExercise;window.updateExercise=updateExercise;window.updateSet=updateSet;window.addFromCatalog=addFromCatalog;window.removeExercise=removeExercise;window.moveExercise=moveExercise;window.toggleWorkoutTimer=toggleWorkoutTimer;window.completeWorkout=completeWorkout;window.chooseCardio=chooseCardio;window.updateCardio=updateCardio;window.toggleCardio=toggleCardio;window.toggleRecovery=toggleRecovery;window.updateRecoveryNotes=updateRecoveryNotes;window.completeRecovery=completeRecovery;window.editMetrics=editMetrics;window.saveMetrics=saveMetrics;window.closeModal=closeModal;window.closeOverlay=closeOverlay;window.openQuickMenu=openQuickMenu;window.saveGripSession=saveGripSession;window.toggleHangTimer=toggleHangTimer;window.deleteHistory=deleteHistory;window.updateSetting=updateSetting;window.updateDayTitle=updateDayTitle;window.startNewWeek=startNewWeek;window.resetEverything=resetEverything;window.exportData=exportData;window.importData=importData;window.notify=notify;
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
render();
</script></body></html>
