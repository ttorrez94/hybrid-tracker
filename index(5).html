<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Hybrid Training</title>
<style>
:root{--bg:#061815;--panel:#0a211c;--panel2:#0d2922;--line:#1e4135;--text:#f2f3ef;--muted:#91a39b;--green:#3f8458;--green2:#75b17a;--danger:#b75d5d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.shell{width:min(100%,620px);margin:0 auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom));min-height:100vh}.top{height:62px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}.top img{width:38px;height:38px;object-fit:contain;margin:auto}.icon-btn{border:0;background:transparent;color:var(--text);width:42px;height:42px;border-radius:12px;display:grid;place-items:center}.icon-btn:active{background:var(--panel2)}.icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.brand{text-align:center;padding:22px 0 18px}.brand img{width:126px;height:126px;object-fit:contain;margin:0 auto 8px}.wordmark{font-weight:900;letter-spacing:.18em;font-size:25px;line-height:1}.wordmark span{display:block;font-size:11px;letter-spacing:.42em;margin:10px 0 0 .42em}.eyebrow{color:var(--green2);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:30px;line-height:1.06;letter-spacing:-.035em;margin:7px 0}p{color:var(--muted)}.hero{display:grid;grid-template-columns:1fr 108px;gap:12px;align-items:center}.hero p{margin:0;font-size:14px}.ring{--score:0;width:102px;height:102px;border-radius:50%;background:conic-gradient(var(--green2) calc(var(--score)*1%),#143027 0);display:grid;place-items:center}.ring-in{width:78px;height:78px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}.ring strong{font-size:26px}.ring small{display:block;font-size:9px;color:var(--muted);letter-spacing:.11em}.card{background:var(--panel);border:1px solid var(--line); -template-columns:1fr 94px}.ring{width:92px;height:92px}.brand img{width:110px;height:110px}}

function defaults(){var ex={mon:[{name:'Incline Dumbbell Press',weight:'55',sets:['12','9','8'],done:false},{name:'Pull-Up',weight:'Bodyweight',sets:['6','6','5'],done:false},{name:'Goblet Squat',weight:'60',sets:['10','10','10'],done:false},{name:'Cable Row',weight:'',sets:['10','10','10'],done:false}],wed:[{name:'Romanian Deadlift',weight:'',sets:['8','8','8'],done:false},{name:'Chest Press',weight:'',sets:['10','10','10'],done:false},{name:'Lat Pulldown',weight:'',sets:['10','10','10'],done:false},{name:'Split Squat',weight:'',sets:['8','8','8'],done:false}],fri:[{name:'Leg Press',weight:'',sets:['10','10','10'],done:false},{name:'Dumbbell Shoulder Press',weight:'',sets:['10','10','10'],done:false},{name:'Seated Row',weight:'',sets:['10','10','10'],done:false},{name:'Hamstring Curl',weight:'',sets:['12','12','12'],done:false}]};DAYS.forEach(function(d){if(!ex[d])ex[d]=[]});var cardio={};DAYS.forEach(function(d){cardio[d]={mode:'Zone 2 Cardio',duration:'30–45 min',effort:'Zone 2',done:false}});return {exercises:ex,cardio:cardio,recovery:{sleep:false,mobility:false,walk:false,hydration:false,notes:'',done:false},metrics:{hrv:'52',rhr:'58',sleep:'7h 42',calories:'2,341'}}}
function safeParse(v,f){try{return v?JSON.parse(v):f}catch(e){return f}}
function normalize(s){var d=defaults();if(!s||typeof s!=='object')return d;if(s.exercises&&typeof s.exercises==='object')d.exercises=s.exercises;if(s.cardio&&typeof s.cardio==='object')d.cardio=s.cardio;if(s.recovery&&typeof s.recovery==='object')d.recovery=s.recovery;if(s.metrics&&typeof s.metrics==='object')d.metrics=s.metrics;DAYS.forEach(function(k){if(!Array.isArray(d.exercises[k]))d.exercises[k]=[];if(!d.cardio[k])d.cardio[k]={mode:'Zone 2 Cardio',duration:'30–45 min',effort:'Zone 2',done:false};d.exercises[k].forEach(function(x){if(!Array.isArray(x.sets))x.sets=['','',''];while(x.sets.length<3)x.sets.push('')})});return d}

function home(){var d=doneDays(),score=72+['sleep','mobility','walk','hydration'].filter(function(k){return state.recovery[k]}).length*6;return appHeader()+'<main><section class="brand"><img src="'+LOGO+'" alt="Grand Teton logo"><div class="wordmark">HYBRID<span>TRAINING</span></div></section><div class="hero"><div><span class="eyebrow">Weekly progress</span><h1>Good morning, Torres.</h1><p>Ready for the next session.</p></div><div class="ring" style="--score:'+(d/7*100)+'"><div class="ring-in"><div><strong>'+d+'/7</strong><small>DAYS</small></div></div></div></div><div class="metrics"><div class="metric card"><strong>'+esc(state.metrics.hrv)+'</strong><span>HRV ms</span></div><div class="metric card"><strong>'+esc(state.metrics.rhr)+'</strong><span>Resting HR</span></div><div class="metric card"><strong>'+esc(state.metrics.sleep)+'</strong><span>Sleep</span></div><div class="metric card"><strong>'+esc(state.metrics.calories)+'</strong><span>Calories</span></div></div><section class="section"><div class="section-head"><h2>Readiness</h2></div><div class="ready card"><div class="ring" style="--score:'+score+'"><div class="ring-in"><div><strong>'+score+'</strong><small>'+(score>80?'HIGH':'GOOD')+'</small></div></div></div><div><h3>'+(score>80?'Ready to perform.':'Ready to train.')+'</h3><p>Your current recovery habits support today’s plan.</p></div></div></section><section class="section"><div class="section-head"><h2>Today’s plan</h2></div><div class="card"><button class="plan-item" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;color:inherit;text-align:left" data-tab="strength"><div class="plan-icon">'+icon('strength')+'</div><div><b>Full Body Strength</b><span>'+LABELS[selectedDay]+' · '+(state.exercises[selectedDay]||[]).length+' exercises</span></div><div class="chev">›</div></button><button class="plan-item" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;color:inherit;text-align:left" data-tab="cardio"><div class="plan-icon">'+icon('heart')+'</div><div><b>Zone 2 Cardio</b><span>120–140 bpm · 30–45 min</span></div><div class="chev">›</div></button><button class="plan-item" style="width:100%;border:0;background:transparent;color:inherit;text-align:left" data-tab="recovery"><div class="plan-icon">'+icon('mountain')+'</div><div><b>Recovery</b><span>Mobility · Hydration · Sleep</span></div><div class="chev">›</div></button></div></section></main>'}
function strength(){var xs=state.exercises[selectedDay]||[];return appHeader()+'<main><div class="title"><h1>Strength</h1><p>Build durable, transferable strength.</p></div>'+week()+'<div class="workout card"><h3>'+LABELS[selectedDay]+' — Full Body</h3><p>'+xs.length+' exercises · Track each set as you go.</p><button class="primary" data-action="complete-strength">COMPLETE WORKOUT</button></div><section class="section"><div class="section-head"><h2>Exercises</h2></div><div class="card">'+(xs.length?xs.map(function(x,i){return '<div class="exercise"><div class="exercise-top"><div class="plan-icon">'+icon('strength')+'</div><div><h4>'+esc(x.name)+'</h4><div class="summary">'+esc(x.weight||'No weight')+' · '+esc((x.sets||[]).join(' / '))+'</div></div><button class="done '+(x.done?'on':'')+'" data-action="toggle-exercise" data-index="'+i+'">'+(x.done?'✓':'')+'</button></div><div class="fields"><div><label>Weight</label><input data-field="weight" data-index="'+i+'" value="'+esc(x.weight)+'" placeholder="lb"></div><div><label>Reps</label><div class="sets">'+[0,1,2].map(function(j){return '<input inputmode="numeric" data-set="'+j+'" data-index="'+i+'" value="'+esc((x.sets||[])[j])+'" placeholder="Set '+(j+1)+'">'}).join('')+'</div></div></div></div>'}).join(''):'<div class="empty">No exercises scheduled.</div>')+'<div class="add"><button data-action="add-exercise">+ ADD EXERCISE</button></div></div></section></main>'}
function cardio(){var c=state.cardio[selectedDay];return appHeader()+'<main><div class="title"><h1>Cardio</h1><p>Train the engine, not just the output.</p></div><div class="seg"><button class="active">Workouts</button><button data-action="notify">Activities</button><button data-action="history">History</button></div>'+week()+'<div class="workout card"><h3>'+esc(c.mode)+'</h3><p>'+LABELS[selectedDay]+' · '+esc(c.duration)+'</p><button class="primary" data-action="toggle-cardio">'+(c.done?'COMPLETED':'START WORKOUT')+'</button></div><section class="section"><div class="section-head"><h2>Heart rate target</h2></div><div class="hr card"><div class="hr-main"><div class="plan-icon">'+icon('heart')+'</div><div><strong>120–140 <span style="font-size:13px;color:var(--muted)">bpm</span></strong><div class="summary">60–70% max heart rate</div></div></div><div class="zone"><i></i><i></i><i></i><i></i><i></i></div><div class="two"><div><label>Duration</label><input id="cardio-duration" value="'+esc(c.duration)+'"></div><div><label>Effort</label><select id="cardio-effort"><option '+(c.effort==='Zone 2'?'selected':'')+'>Zone 2</option><option '+(c.effort==='Easy'?'selected':'')+'>Easy</option><option '+(c.effort==='Hard'?'selected':'')+'>Hard</option></select></div></div></div></section><section class="section"><div class="section-head"><h2>Workout options</h2></div><div class="card">'+['Zone 2 Cardio','HIIT','LISS'].map(function(n,i){return '<button class="plan-item" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;color:inherit;text-align:left" data-mode="'+n+'"><div class="plan-icon">'+icon('heart')+'</div><div><b>'+n+'</b><span>'+['30–45 min · Endurance','20–30 min · Performance','45–60 min · Fat burn'][i]+'</span></div><div class="chev">›</div></button>'}).join('')+'</div></section></main>'}
function recovery(){var r=state.recovery,keys=[['sleep','Sleep target'],['mobility','Mobility'],['walk','Recovery walk'],['hydration','Hydration']],score=72+keys.filter(function(x){return r[x[0]]}).length*6;return appHeader()+'<main><div class="title"><h1>Recovery</h1><p>Build capacity by recovering on purpose.</p></div><div class="recovery card"><div class="ring" style="--score:'+score+'"><div class="ring-in"><div><strong>'+score+'</strong><small>'+(score>80?'HIGH':'GOOD')+'</small></div></div></div><h2>'+(score>80?'Ready to perform':'Keep rebuilding')+'</h2><p>Your score responds to the habits below.</p></div><section class="section"><div class="section-head"><h2>Today</h2></div><div class="card">'+keys.map(function(x){return '<div class="check"><span>'+x[1]+'</span><button class="switch '+(r[x[0]]?'on':'')+'" data-recovery="'+x[0]+'"><span></span></button></div>'}).join('')+'</div></section><section class="section"><div class="workout card"><h3>Recovery notes</h3><p>Track soreness, energy, or anything that should influence tomorrow.</p><textarea id="recovery-notes" rows="4" style="margin-top:10px" placeholder="How do you feel?">'+esc(r.notes)+'</textarea><button class="primary" data-action="complete-recovery">'+(r.done?'RECOVERY COMPLETE':'COMPLETE RECOVERY')+'</button></div></section></main>'}
function more(){return appHeader()+'<main><div class="title"><h1>More</h1><p>Your supporting tools and data.</p></div><div class="more-grid"><button class="more-card" data-action="history">'+icon('chart')+'<b>History</b><span>Completed sessions and lifts</span></button><button class="more-card" data-action="notify">'+icon('body')+'<b>Body Map</b><span>Training volume by muscle</span></button><button class="more-card" data-action="notify">'+icon('hand')+'<b>Grip</b><span>Climbing and hand strength</span></button><button class="more-card" data-action="notify">'+icon('book')+'<b>Catalog</b><span>Exercise library</span></button></div><div class="backup card"><div class="section-head"><h2>Backup</h2></div><div class="backup-row"><button data-action="export">'+icon('download')+' Export</button><label>'+icon('upload')+' Import<input id="import-file" type="file" accept="application/json"></label></div></div></main>'}
function historyView(){return appHeader()+'<main><div class="title"><h1>History</h1><p>Your completed work.</p></div><button class="secondary" data-tab="more">← Back</button><section class="section"><div class="card">'+(history.length?history.slice().reverse().slice(0,50).map(function(h){return '<div class="history-item"><b>'+esc(h.exercise||h.mode||'Workout')+'</b><span>'+esc(h.date||'')+(h.weight?' · '+esc(h.weight):'')+(h.reps?' · '+esc(h.reps):'')+'</span></div>'}).join(''):'<div class="empty">No completed exercises yet.</div>')+'</div></section></main>'}
function render(){var content=active==='home'?home():active==='strength'?strength():active==='cardio'?cardio():active==='recovery'?recovery():active==='history'?historyView():more();document.getElementById('app').innerHTML='<div class="app"><div class="shell">'+content+'</div>'+nav()+'</div>';document.documentElement.setAttribute('data-hybrid-ready','true')}
function notify(msg){var old=document.querySelector('.toast');if(old)old.remove();var t=document.createElement('div');t.className='toast';t.textContent=msg||'Coming soon';document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},1800)}
function setTab(t){active=t;render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){var tab=e.target.closest('[data-tab]');if(tab){setTab(tab.getAttribute('data-tab'));return}var day=e.target.closest('[data-day]');if(day){selectedDay=day.getAttribute('data-day');render();return}var a=e.target.closest('[data-action]');if(a){var act=a.getAttribute('data-action');if(act==='more')setTab('more');else if(act==='settings')notify('Settings are available in More');else if(act==='history'){active='history';render();window.scrollTo(0,0)}else if(act==='notify')notify('This tool is preserved for the next update');else if(act==='add-exercise'){var n=window.prompt('Exercise name');if(n){state.exercises[selectedDay].push({name:n,weight:'',sets:['','',''],done:false});save();render()}}else if(act==='toggle-exercise'){var i=parseInt(a.getAttribute('data-index'),10),x=state.exercises[selectedDay][i];x.done=!x.done;if(x.done)history.push({date:new Date().toISOString().slice(0,10),day:LABELS[selectedDay],exercise:x.name,weight:x.weight,reps:(x.sets||[]).join(' / ')});save();render()}else if(act==='complete-strength'){state.exercises[selectedDay].forEach(function(x){x.done=true});save();notify('Strength workout completed');render()}else if(act==='toggle-cardio'){state.cardio[selectedDay].done=!state.cardio[selectedDay].done;save();render()}else if(act==='complete-recovery'){state.recovery.done=!state.recovery.done;save();render()}else if(act==='export'){var blob=new Blob([JSON.stringify({state:state,history:history,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});var u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='hybrid-training-backup.json';document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(u)},100)}return}var r=e.target.closest('[data-recovery]');if(r){var k=r.getAttribute('data-recovery');state.recovery[k]=!state.recovery[k];save();render();return}var m=e.target.closest('[data-mode]');if(m){state.cardio[selectedDay].mode=m.getAttribute('data-mode');save();render();return}});
document.addEventListener('input',function(e){if(e.target.matches('[data-field="weight"]')){state.exercises[selectedDay][parseInt(e.target.getAttribute('data-index'),10)].weight=e.target.value;save()}else if(e.target.matches('[data-set]')){var x=state.exercises[selectedDay][parseInt(e.target.getAttribute('data-index'),10)],j=parseInt(e.target.getAttribute('data-set'),10);x.sets[j]=e.target.value;save()}else if(e.target.id==='cardio-duration'){state.cardio[selectedDay].duration=e.target.value;save()}else if(e.target.id==='recovery-notes'){state.recovery.notes=e.target.value;save()}});
document.addEventListener('change',function(e){if(e.target.id==='cardio-effort'){state.cardio[selectedDay].effort=e.target.value;save()}else if(e.target.id==='import-file'&&e.target.files&&e.target.files[0]){var reader=new FileReader();reader.onload=function(){try{var d=JSON.parse(reader.result);if(d.state)state=normalize(d.state);if(Array.isArray(d.history))history=d.history;save();render();notify('Backup restored')}catch(err){window.alert('Could not import this backup.')}};reader.readAsText(e.target.files[0])}});
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
try{
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(reg){reg.unregister()});
    }).catch(function(){});
  }
  if('caches' in window){
    caches.keys().then(function(keys){
      keys.forEach(function(key){caches.delete(key)});
    }).catch(function(){});
  }
}catch(cleanupError){}
try{load();render()}catch(err){document.getElementById('app').innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div><img src="'+LOGO+'" style="width:90px;height:90px;object-fit:contain;margin:auto"><h2>Hybrid Training could not start</h2><p style="max-width:360px">'+esc(err&&err.message?err.message:String(err))+'</p></div></div>'}
})();
</script></body></html>
